name: ✨ Feature request
description: Suggest a new option, control or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like?
      description: Describe the feature, and the problem or wish behind it.
      placeholder: An option to swap the stick to the right side of the screen for left-handed players.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Display
        - Graphics
        - Touch controls
        - Gyroscope
        - Controller
        - Keyboard and mouse
        - Sound
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Any workaround you use today, or other ways it could work.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, or examples from other ports.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and this hasn't been requested yet.
          required: true
